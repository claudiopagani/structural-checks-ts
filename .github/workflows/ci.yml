name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v6
        with:
          path: structural-checks-ts
      - uses: actions/checkout@v6
        with:
          repository: claudiopagani/strutture-normative
          path: strutture-normative
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: structural-checks-ts/package-lock.json
      - run: npm ci
        working-directory: structural-checks-ts
      - run: npm run release:verify
        working-directory: structural-checks-ts
